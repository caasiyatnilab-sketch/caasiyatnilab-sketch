<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Performance: Placing title before CSS allows the title to be rendered as soon as it's parsed -->
    <title>Portfolio Website</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Performance: 'defer' allows the script to be downloaded in parallel with HTML parsing without blocking the DOM construction -->
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section id="about">
        <h2>About Me</h2>
        <p>Welcome to my portfolio website!</p>
    </section>
    <section id="projects">
        <h2>Projects</h2>
        <p>Here are some of my projects...</p>
    </section>
    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@example.com</p>
    </section>
</body>
</html>
